<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Urban Aware Interface</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="window/window.css" />
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="nav-bar">
    <div class="nav-container">
      <a href="#" class="nav-item" data-panel="0">
        <span class="page-number">01</span>
        <span>Intro</span>
      </a>
      <a href="#" class="nav-item" data-panel="1">
        <span class="page-number">02</span>
        <span>Mirror</span>
      </a>
      <a href="#" class="nav-item" data-panel="2">
        <span class="page-number">03</span>
        <span>Window</span>
      </a>
      <a href="#" class="nav-item" data-panel="3">
        <span class="page-number">04</span>
        <span>Wardrobe</span>
      </a>
      <a href="#" class="nav-item" data-panel="4">
        <span class="page-number">05</span>
        <span>Door</span>
      </a>
    </div>
  </nav>

  <div id="container">
    <div class="panel" id="panel1">Intro</div>

    <!-- PANEL 2: THE MIRROR -->
    <div class="panel" id="panel2">
      <div id="mirror-container">
        <div class="mirror-frame">
          <div class="mirror-glass">
            <div id="ghost-figure">
              <div id="aura-layer"></div>
              <div class="ghost-flow"></div>
              <div class="ghost-flow"></div>
              <div class="ghost-flow"></div>
              <div class="ghost-flow"></div>
              <div id="body-core">
                <div class="ghost-head">
                </div>
              </div>
              <div class="face-layer">
                <div class="face-element eye" style="top: 35px; left: 35px;"></div>
                <div class="face-element eye" style="top: 35px; right: 35px;"></div>
                <div class="face-element mouth" style="top: 55px; left: 50%; transform: translateX(-50%);"></div>
              </div>
            </div>
            <div id="sparkle-container"></div>
          </div>
        </div>
        <div id="floating-prompt"></div>
        <div id="interaction-layer"></div>
      </div>
    </div>

    <!-- PANEL 3: THE WINDOW -->
    <div class="panel" id="panel3">
      <div id="window-panel" class="window-container">
        
        <!-- NEW WRAPPER: window-strip -->
        <div class="window-strip">
          <!-- Map window frame -->
          <div class="window-frame map-window">
            <div class="window-inputs">
              <input type="text" id="start-location" placeholder="Start location" />
              <input type="text" id="end-location" placeholder="Destination" />
              <button id="route-btn">Show Route</button>
            </div>
            <div id="map-container"></div>
          </div>

          <!-- Visualization window frame -->
          <div class="window-frame viz-window">
            <canvas id="sky-canvas"></canvas>
            <div id="glare-overlay"></div> 
            <div id="wind-overlay"></div>
            <div class="floating-prompt">
              <p class="question">Where are you going today?</p>
              <p class="instruction">Type your route—your journey will shape the sky.</p>
            </div>
          </div>
        </div>
        <!-- END of window-strip -->

      </div>
    </div>

    <div class="panel" id="panel4">Wardrobe</div>
    <div class="panel" id="panel5">Door</div>
  </div>

  <div id="custom-cursor"></div>

  <script src="script.js"></script>
  <script src="bed/bed.js"></script>
  <script src="window/wind.js"></script>
  <script src="window/window.js"></script>
  <script src="window/mirror.js"></script>
</body>
</html>
