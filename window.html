<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Window - Urban Aware Interface</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="window/window.css" />
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="nav-bar">
    <div class="nav-container">
      <a href="index.html" class="nav-item">
        <span class="page-number">01</span>
        <span>Intro</span>
      </a>
      <a href="mirror.html" class="nav-item">
        <span class="page-number">02</span>
        <span>Mirror</span>
      </a>
      <a href="window.html" class="nav-item active">
        <span class="page-number">03</span>
        <span>Window</span>
      </a>
      <a href="wardrobe.html" class="nav-item">
        <span class="page-number">04</span>
        <span>Wardrobe</span>
      </a>
      <a href="door.html" class="nav-item">
        <span class="page-number">05</span>
        <span>Door</span>
      </a>
    </div>
  </nav>

  <!-- Window Panel -->
  <div id="window-panel" class="window-container">
    
    <!-- Window Strip -->
    <div class="window-strip">
      <!-- Map window frame -->
      <div class="window-frame map-window">
        <div class="window-inputs">
          <input type="text" id="start-location" placeholder="Start location" />
          <input type="text" id="end-location" placeholder="Destination" />
          <button id="route-btn">Show Route</button>
        </div>
        <div id="map-container"></div>
      </div>

      <!-- Visualization window frame -->
      <div class="window-frame viz-window">
        <canvas id="sky-canvas"></canvas>
        <div id="glare-overlay"></div> 
        <div id="wind-overlay"></div>
        <div class="floating-prompt">
          <p class="question">Where are you going today?</p>
          <p class="instruction">Type your route—your journey will shape the sky.</p>
        </div>
      </div>
    </div>
    <!-- END of window-strip -->

  </div>

  <div id="custom-cursor"></div>

  <script src="script.js"></script>
  <script src="window/wind.js"></script>
  <script src="window/window.js"></script>
</body>
</html>
